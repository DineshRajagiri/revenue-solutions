 <header id="site-header">
  <div class="container">
    <div class="header-inner">
      <div class="site-logo"> <a [routerLink]="['/home']"> <a
            [routerLink]="['/home']"
            class="custom-logo-link" rel="home"
            aria-current="page"><img fetchpriority="high" width="448"
              height="408"
              src="/assets/img/wp-content/uploads/2026/06/MMR-LOGO-PNG-e1691834236181.png"
              class="custom-logo" alt
              decoding="async" fetchpriority="high"
              srcset="/assets/img/wp-content/uploads/2026/06/MMR-LOGO-PNG-e1691834236181.png 448w, /assets/img/wp-content/uploads/2026/06/MMR-LOGO-PNG-e1691834236181-300x273.png 300w"
              sizes="(max-width: 448px) 100vw, 448px" loading="lazy" /></a>
        </a> </div>
      <nav id="primary-nav" aria-label="Main navigation">
        <div id="mmr-nav-close-row"> <span
            style="font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em">Menu</span>
          <button id="mmr-nav-close-btn"
            style="background:none;border:none;cursor:pointer;padding:6px;color:var(--ink);display:flex;align-items:center"
            aria-label="Close menu"> <svg width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5">
              <line x1="4" y1="4" x2="20" y2="20" />
              <line x1="20" y1="4" x2="4" y2="20" />
            </svg> </button>
        </div>
        <div class="nav-item"><a [routerLink]="['/home']"
            class="nav-link">Home</a>
        </div>
        <div class="nav-item"><span class="nav-link" tabindex="0" role="button"
            aria-haspopup="true">Resources<svg
              class="chevron" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9" />
            </svg></span>
          <div class="dropdown"><a
              [routerLink]="['/hotel-revenue-management']">Hotel
              Revenue Management</a><a
              [routerLink]="['/ota-distribution-strategy']">OTA
              Distribution Strategy</a><a
              [routerLink]="['/hotel-reputation-reviews']">Hotel
              Reputation &amp; Reviews</a><a
              [routerLink]="['/hotel-direct-booking']">Hotel Direct
              Booking</a>
            <div class="dropdown-divider"></div><a
              [routerLink]="['/indian-hospitality-industry']">Indian
              Hospitality Industry</a>
          </div>
        </div>
        <div class="nav-item"><span class="nav-link" tabindex="0" role="button"
            aria-haspopup="true">Company<svg
              class="chevron" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9" />
            </svg></span>
          <div class="dropdown"><a [routerLink]="['/about']">About Us</a><a
              [routerLink]="['/careers']">Careers</a><a
              [routerLink]="['/revenue-insights']">Revenue
              Insights</a></div>
        </div>
        <div id="mmr-nav-cta"
          style="padding:24px 20px 32px;margin-top:8px;border-top:1px solid rgba(6,14,28,.07)">
          <a [routerLink]="['/book-revenue-audit']"
            style="display:block;background:var(--navy,#060E1C);color:#fff;text-align:center;padding:13px 16px;border-radius:9px;font-size:.875rem;font-weight:700;text-decoration:none;margin-bottom:10px">Book
            Revenue Audit</a> <a [routerLink]="['/login']"
            style="display:block;text-align:center;padding:11px 16px;border-radius:9px;font-size:.875rem;font-weight:500;color:var(--ink-3,#64748B);border:1px solid rgba(6,14,28,.12);text-decoration:none">Login</a>
        </div>
      </nav>
      <div class="nav-actions"> <a
          [routerLink]="['/book-revenue-audit']"
          class="btn btn-primary btn-sm">Book Revenue Audit</a> <button
          class="mobile-toggle" id="mobile-toggle" aria-label="Menu"> <svg
            width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg> </button> </div>
    </div>
  </div>
</header>
